<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

.content img { max-width: 100%; border-radius: 6px; }
footer { margin-top: 40px; padding-top: 16px; border-top: 1px solid #2a2a4a; text-align: center; color: #555; font-size: 0.8rem; }
@media print {
  body { background: white; color: black; }
  h1 { color: black; }
  .meta { background: #f5f5f5; border-color: #ccc; }

</script>
