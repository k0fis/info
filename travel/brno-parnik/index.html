<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

nav { margin-bottom: 20px; }
nav a { color: #82c4e6; text-decoration: none; font-size: 0.9rem; }
nav a:hover { text-decoration: underline; }
h1 { font-size: 1.6rem; margin-bottom: 12px; }
.meta { margin-bottom: 16px; padding: 12px; background: #16213e; border: 1px solid #2a2a4a; border-radius: 8px; }
.meta-item { margin: 4px 0; font-size: 0.9rem; }
.meta-item a { color: #82c4e6; }
.tags { margin-bottom: 16px; display: flex; gap: 6px; flex-wrap: wrap; }
.tag { font-size: 0.8rem; color: #7f8fa6; background: #2a3a4a; padding: 3px 8px; border-radius: 4px; }
.content { line-height: 1.7; }
.content h2 { color: #82c4e6; margin: 24px 0 8px; font-size: 1.2rem; }
.content h3 { color: #6ec8e6; margin: 16px 0 6px; font-size: 1rem; }
.content p { margin-bottom: 12px; }
.content ul, .content ol { margin: 0 0 12px 24px; }
.content a { color: #82c4e6; }
.content table { border-collapse: collapse; margin: 12px 0; width: 100%; }
.content th, .content td { border: 1px solid #2a2a4a; padding: 6px 10px; text-align: left; }
.content th { background: #16213e; }
.content code { background: #2a3a4a; padding: 2px 5px; border-radius: 3px; font-size: 0.85em; }
.content pre { background: #16213e; padding: 12px; border-radius: 6px; overflow-x: auto; margin: 12px 0; }
.content blockquote { border-left: 3px solid #3a4a5a; padding-left: 12px; color: #aaa; margin: 12px 0; }
.content img { max-width: 100%; border-radius: 6px; }
footer { margin-top: 40px; padding-top: 16px; border-top: 1px solid #2a2a4a; text-align: center; color: #555; font-size: 0.8rem; }
@media print {
  body { background: white; color: black; }
  h1 { color: black; }
  .meta { background: #f5f5f5; border-color: #ccc; }
  .content h2, .content h3 { color: #333; }
  .content a { color: #0066cc; }
}
